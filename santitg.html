<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>三题通关 - 精准计算训练营</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Microsoft YaHei', Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            -webkit-tap-highlight-color: transparent;
            -webkit-touch-callout: none;
        }

        .container {
            width: 100%;
            max-width: 800px;
            background: white;
            border-radius: 30px;
            padding: 40px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
        }

        /* 主页样式 */
        .page {
            display: none;
        }

        .page.active {
            display: block;
            animation: fadeIn 0.5s ease-in;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .title {
            text-align: center;
            color: #667eea;
            font-size: 36px;
            margin-bottom: 30px;
            font-weight: bold;
        }

        /* 成长之树样式 */
        .tree-container {
            text-align: center;
            margin: 30px 0;
            padding: 30px;
            background: linear-gradient(to bottom, #e0f7fa 0%, #f1f8e9 100%);
            border-radius: 20px;
            position: relative;
            overflow: hidden;
        }

        .tree-display {
            font-size: 120px;
            height: 180px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.5s ease;
        }

        .tree-info {
            font-size: 24px;
            color: #4caf50;
            font-weight: bold;
            margin-top: 15px;
        }

        .tree-level {
            font-size: 18px;
            color: #666;
            margin-top: 10px;
        }

        /* 按钮样式 */
        .btn {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 18px 50px;
            font-size: 24px;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 8px 15px rgba(102, 126, 234, 0.4);
            display: block;
            margin: 20px auto;
            width: fit-content;
        }

        .btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 12px 20px rgba(102, 126, 234, 0.6);
        }

        .btn:active {
            transform: translateY(-1px);
        }

        /* 选择页面样式 */
        .selection-group {
            margin: 40px 0;
        }

        .selection-title {
            font-size: 28px;
            color: #333;
            margin-bottom: 20px;
            font-weight: bold;
        }

        .radio-group {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .radio-option {
            background: #f5f5f5;
            padding: 20px 25px;
            border-radius: 15px;
            cursor: pointer;
            transition: all 0.3s ease;
            border: 3px solid transparent;
            display: flex;
            align-items: center;
        }

        .radio-option:hover {
            background: #e8eaf6;
            transform: translateX(5px);
        }

        .radio-option:active {
            transform: scale(0.98);
        }

        .radio-option.selected {
            background: #e8eaf6;
            border-color: #667eea;
        }

        .radio-option input[type="radio"] {
            position: absolute;
            width: 1px;
            height: 1px;
            opacity: 0;
            pointer-events: none;
        }

        .radio-option:focus-within {
            outline: 3px solid #fbbf24;
            outline-offset: 3px;
        }

        .radio-label {
            font-size: 22px;
            color: #333;
            cursor: pointer;
            width: 100%;
            display: flex;
            align-items: center;
        }

        .radio-label::before {
            content: '';
            width: 24px;
            height: 24px;
            border: 3px solid #667eea;
            border-radius: 50%;
            margin-right: 15px;
            display: inline-block;
            transition: all 0.3s ease;
        }

        .radio-option.selected .radio-label::before {
            background: #667eea;
            box-shadow: inset 0 0 0 4px white;
        }

        .mode-description {
            font-size: 16px;
            color: #666;
            margin-left: 39px;
            margin-top: 5px;
        }

        /* 答题界面样式 */
        .questions-container {
            margin: 30px 0;
        }

        .question-item {
            background: #f9f9f9;
            padding: 25px;
            border-radius: 15px;
            margin-bottom: 20px;
            transition: all 0.3s ease;
        }

        .question-item.error {
            background: #ffebee;
            border: 2px solid #f44336;
        }

        .question-text {
            font-size: 32px;
            color: #333;
            margin-bottom: 15px;
            font-weight: bold;
        }

        .answer-input {
            width: 100%;
            padding: 15px 20px;
            font-size: 28px;
            border: 3px solid #ddd;
            border-radius: 10px;
            transition: all 0.3s ease;
            text-align: center;
        }

        .answer-input:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 10px rgba(102, 126, 234, 0.3);
        }

        .answer-input.error {
            border-color: #f44336;
        }

        .error-mark {
            color: #f44336;
            font-size: 24px;
            margin-top: 10px;
            font-weight: bold;
            display: none;
        }

        .error-mark.show {
            display: block;
        }

        /* 提示信息 */
        .message-box {
            background: #fff3cd;
            border: 2px solid #ffc107;
            color: #856404;
            padding: 20px;
            border-radius: 15px;
            margin: 20px 0;
            font-size: 20px;
            text-align: center;
            display: none;
        }

        .message-box.show {
            display: block;
            animation: shake 0.5s ease;
        }

        .message-box.error {
            background: #ffebee;
            border-color: #f44336;
            color: #c62828;
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-10px); }
            75% { transform: translateX(10px); }
        }

        /* 完成界面样式 */
        .completion-container {
            text-align: center;
            padding: 40px 0;
        }

        .celebration {
            font-size: 100px;
            margin: 20px 0;
            animation: bounce 1s ease infinite;
        }

        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-20px); }
        }

        .completion-message {
            font-size: 32px;
            color: #4caf50;
            margin: 20px 0;
            font-weight: bold;
        }

        .points-animation {
            font-size: 48px;
            color: #ff9800;
            font-weight: bold;
            margin: 30px 0;
            animation: pointsFloat 1s ease;
        }

        @keyframes pointsFloat {
            0% { opacity: 0; transform: translateY(50px) scale(0.5); }
            50% { opacity: 1; transform: translateY(-10px) scale(1.2); }
            100% { opacity: 1; transform: translateY(0) scale(1); }
        }

        .btn-group {
            display: flex;
            gap: 20px;
            justify-content: center;
            flex-wrap: wrap;
            margin-top: 30px;
        }

        .btn-secondary {
            background: linear-gradient(135deg, #11998e 0%, #38ef7d 100%);
        }

        /* 升级动画 */
        .level-up-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.8);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .level-up-overlay.show {
            display: flex;
            animation: fadeIn 0.5s ease;
        }

        .level-up-content {
            background: white;
            padding: 50px;
            border-radius: 30px;
            text-align: center;
            animation: scaleIn 0.5s ease;
        }

        @keyframes scaleIn {
            0% { transform: scale(0.5); }
            100% { transform: scale(1); }
        }

        .level-up-text {
            font-size: 48px;
            color: #ff9800;
            font-weight: bold;
            margin-bottom: 20px;
        }

        .level-up-tree {
            font-size: 150px;
            margin: 20px 0;
        }

        /* 响应式设计 - 手机端优化 */
        @media (max-width: 768px) {
            body {
                padding: 10px;
                align-items: flex-start;
                padding-top: 20px;
            }

            .container {
                padding: 20px 15px;
                border-radius: 20px;
                margin: 0 auto;
            }

            .title {
                font-size: 26px;
                margin-bottom: 20px;
            }

            /* 成长之树优化 */
            .tree-container {
                padding: 20px 15px;
                margin: 20px 0;
            }

            .tree-display {
                font-size: 80px;
                height: 100px;
            }

            .tree-info {
                font-size: 20px;
            }

            .tree-level {
                font-size: 16px;
            }

            /* 选择页面优化 */
            .selection-group {
                margin: 25px 0;
            }

            .selection-title {
                font-size: 22px;
                margin-bottom: 15px;
            }

            .radio-option {
                padding: 18px 15px;
            }

            .radio-label {
                font-size: 18px;
            }

            .radio-label::before {
                width: 20px;
                height: 20px;
                border-width: 2px;
                margin-right: 12px;
                flex-shrink: 0;
            }

            .mode-description {
                font-size: 14px;
                margin-left: 32px;
            }

            /* 答题界面优化 */
            .questions-container {
                margin: 20px 0;
            }

            .question-item {
                padding: 18px 15px;
                margin-bottom: 15px;
            }

            .question-text {
                font-size: 22px;
                margin-bottom: 12px;
                line-height: 1.4;
            }

            .answer-input {
                font-size: 24px;
                padding: 12px 15px;
                border-width: 2px;
                /* 移动端数字键盘优化 */
                -webkit-appearance: none;
                appearance: none;
            }

            .error-mark {
                font-size: 18px;
                margin-top: 8px;
            }

            /* 按钮优化 - 更大更好点击 */
            .btn {
                font-size: 20px;
                padding: 16px 35px;
                width: 100%;
                max-width: 300px;
                margin: 15px auto;
                /* 触摸优化 */
                -webkit-tap-highlight-color: rgba(255, 255, 255, 0.3);
                touch-action: manipulation;
            }

            .btn:active {
                transform: scale(0.95);
            }

            .btn-group {
                flex-direction: column;
                gap: 12px;
                margin-top: 20px;
            }

            /* 消息框优化 */
            .message-box {
                padding: 15px;
                font-size: 18px;
                margin: 15px 0;
                line-height: 1.5;
            }

            /* 完成页面优化 */
            .completion-container {
                padding: 20px 0;
            }

            .celebration {
                font-size: 80px;
                margin: 15px 0;
            }

            .completion-message {
                font-size: 24px;
                margin: 15px 0;
            }

            .points-animation {
                font-size: 40px;
                margin: 20px 0;
            }

            /* 升级动画优化 */
            .level-up-content {
                padding: 30px 20px;
                border-radius: 20px;
                margin: 0 15px;
                max-width: 90%;
            }

            .level-up-text {
                font-size: 32px;
                margin-bottom: 15px;
            }

            .level-up-tree {
                font-size: 100px;
                margin: 15px 0;
            }
        }

        /* 超小屏幕优化 (小于375px) */
        @media (max-width: 375px) {
            body {
                padding: 8px;
                padding-top: 15px;
            }

            .container {
                padding: 18px 12px;
            }

            .title {
                font-size: 24px;
                margin-bottom: 18px;
            }

            .tree-display {
                font-size: 70px;
                height: 90px;
            }

            .tree-info {
                font-size: 18px;
            }

            .tree-level {
                font-size: 14px;
            }

            .selection-title {
                font-size: 20px;
            }

            .radio-label {
                font-size: 17px;
            }

            .question-text {
                font-size: 20px;
            }

            .answer-input {
                font-size: 22px;
                padding: 12px;
            }

            .btn {
                font-size: 18px;
                padding: 14px 30px;
            }

            .completion-message {
                font-size: 22px;
            }

            .points-animation {
                font-size: 36px;
            }

            .level-up-text {
                font-size: 28px;
            }

            .level-up-tree {
                font-size: 90px;
            }
        }

        /* 横屏模式优化 */
        @media (max-height: 600px) and (orientation: landscape) {
            body {
                align-items: flex-start;
                padding: 10px;
            }

            .tree-display {
                font-size: 60px;
                height: 80px;
            }

            .celebration {
                font-size: 60px;
            }

            .level-up-content {
                padding: 20px;
            }

            .level-up-tree {
                font-size: 80px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- 主页 -->
        <div id="homePage" class="page active">
            <h1 class="title">🎯 三题通关</h1>
            <div class="tree-container">
                <div class="tree-display" id="treeDisplay">🌱</div>
                <div class="tree-info">总积分: <span id="totalPoints">0</span> 分</div>
                <div class="tree-level" id="treeLevel">种子阶段</div>
            </div>
            <button class="btn" onclick="goToSelection()">开始训练</button>
        </div>

        <!-- 选择页面 -->
        <div id="selectionPage" class="page">
            <h1 class="title">选择训练</h1>
            
            <div class="selection-group">
                <div class="selection-title">📚 选择训练内容</div>
                <div class="radio-group">
                    <div class="radio-option selected">
                        <label class="radio-label">
                            <input type="radio" name="content" value="addition" onchange="selectContent(this)" checked>
                            三位数加减混合运算
                        </label>
                    </div>
                    <div class="radio-option">
                        <label class="radio-label">
                            <input type="radio" name="content" value="multiplication" onchange="selectContent(this)">
                            表内乘法四则混合运算
                        </label>
                    </div>
                </div>
            </div>

            <div class="selection-group">
                <div class="selection-title">🎮 选择训练模式</div>
                <div class="radio-group">
                    <div class="radio-option selected">
                        <label class="radio-label">
                            <input type="radio" name="mode" value="easy" onchange="selectMode(this)" checked>
                            简单模式
                        </label>
                        <div class="mode-description">两步运算，提示错题位置，积分 +1</div>
                    </div>
                    <div class="radio-option">
                        <label class="radio-label">
                            <input type="radio" name="mode" value="hard" onchange="selectMode(this)">
                            困难模式
                        </label>
                        <div class="mode-description">两步运算，只提示错题数量，积分 +2</div>
                    </div>
                    <div class="radio-option">
                        <label class="radio-label">
                            <input type="radio" name="mode" value="master" onchange="selectMode(this)">
                            大师模式
                        </label>
                        <div class="mode-description">四步运算，只提示错题数量，积分 +3</div>
                    </div>
                </div>
            </div>

            <button class="btn" onclick="startTraining()">确认，开始训练</button>
        </div>

        <!-- 答题页面 -->
        <div id="trainingPage" class="page">
            <h1 class="title">📝 开始答题</h1>
            
            <div class="message-box" id="messageBox" role="status" aria-live="polite"></div>
            
            <div class="questions-container" id="questionsContainer">
                <!-- 题目将在这里动态生成 -->
            </div>

            <div class="btn-group">
                <button class="btn" onclick="submitAnswers()">提交检查</button>
                <button class="btn btn-secondary" onclick="backToSelection()">返回上一步</button>
            </div>
        </div>

        <!-- 完成页面 -->
        <div id="completionPage" class="page">
            <div class="completion-container">
                <div class="celebration">🎉</div>
                <div class="completion-message">恭喜你，全部正确！</div>
                <div class="completion-message">本组训练完成！</div>
                <div class="points-animation" id="pointsAnimation">+1 分</div>
                <div class="tree-info">当前总积分: <span id="currentPoints">0</span> 分</div>
                
                <div class="btn-group">
                    <button class="btn" onclick="nextRound()">开始下一组</button>
                    <button class="btn btn-secondary" onclick="goHome()">返回主页</button>
                </div>
            </div>
        </div>
    </div>

    <!-- 升级动画覆盖层 -->
    <div class="level-up-overlay" id="levelUpOverlay">
        <div class="level-up-content">
            <div class="level-up-text">🎊 恭喜升级！🎊</div>
            <div class="level-up-tree" id="levelUpTree">🌱</div>
            <div class="tree-level" id="levelUpText">破土而出的小树苗</div>
            <button class="btn" onclick="closeLevelUp()">太棒了！</button>
        </div>
    </div>

    <script>
        // 全局变量
        let currentContent = 'addition'; // 当前训练内容
        let currentMode = 'easy'; // 当前训练模式
        let currentQuestions = []; // 当前题目集
        let totalPoints = 0; // 总积分

        // 树的等级配置
        // 如果想使用自定义图片，请取消注释 image 字段并填入图片路径
        // 支持格式：PNG, GIF, SVG, JPG, WebP
        // 推荐尺寸：300x300 到 500x500 像素（正方形）
        const treeLevels = [
            { minPoints: 0, maxPoints: 1, emoji: '🌱', name: '种子阶段', image: '' }, // 例如：'./public/tree-stage-1.png'
            { minPoints: 2, maxPoints: 5, emoji: '🌿', name: '破土而出的小树苗', image: '' },
            { minPoints: 6, maxPoints: 15, emoji: '🌳', name: '茁壮的小树苗', image: '' },
            { minPoints: 16, maxPoints: 30, emoji: '🌲', name: '有茂密树叶的小树', image: '' },
            { minPoints: 31, maxPoints: 50, emoji: '🎄', name: '健壮的大树', image: '' },
            { minPoints: 51, maxPoints: 100, emoji: '🌸', name: '开花的大树', image: '' },
            { minPoints: 101, maxPoints: Infinity, emoji: '🍎', name: '结满果实的大树', image: '' }
        ];

        // 初始化
        function init() {
            loadProgress();
            updateTreeDisplay();
        }

        // 加载进度
        function loadProgress() {
            const saved = localStorage.getItem('santitg_progress');
            if (saved) {
                const data = JSON.parse(saved);
                totalPoints = data.totalPoints || 0;
            }
        }

        // 保存进度
        function saveProgress() {
            localStorage.setItem('santitg_progress', JSON.stringify({
                totalPoints: totalPoints
            }));
        }

        // 更新树的显示
        function updateTreeDisplay() {
            const level = getTreeLevel(totalPoints);
            const treeDisplay = document.getElementById('treeDisplay');
            
            // 如果配置了自定义图片，显示图片；否则显示emoji
            if (level.image && level.image.trim() !== '') {
                treeDisplay.innerHTML = `<img src="${level.image}" alt="${level.name}" style="max-width: 100%; max-height: 100%; object-fit: contain;">`;
            } else {
                treeDisplay.textContent = level.emoji;
            }
            
            document.getElementById('totalPoints').textContent = totalPoints;
            document.getElementById('treeLevel').textContent = level.name;
        }

        // 获取树的等级
        function getTreeLevel(points) {
            for (let level of treeLevels) {
                if (points >= level.minPoints && points <= level.maxPoints) {
                    return level;
                }
            }
            return treeLevels[treeLevels.length - 1];
        }

        // 页面切换
        function showPage(pageId) {
            document.querySelectorAll('.page').forEach(page => {
                page.classList.remove('active');
            });
            document.getElementById(pageId).classList.add('active');
        }

        // 前往选择页面
        function goToSelection() {
            showPage('selectionPage');
        }

        // 选择内容
        function selectContent(input) {
            currentContent = input.value;
            document.querySelectorAll('input[name="content"]').forEach(option => {
                option.closest('.radio-option').classList.toggle('selected', option.checked);
            });
        }

        // 选择模式
        function selectMode(input) {
            currentMode = input.value;
            document.querySelectorAll('input[name="mode"]').forEach(option => {
                option.closest('.radio-option').classList.toggle('selected', option.checked);
            });
        }

        // 开始训练
        function startTraining() {
            generateQuestions();
            renderQuestions();
            showPage('trainingPage');
        }

        // 生成题目
        function generateQuestions() {
            currentQuestions = [];
            const isMasterMode = currentMode === 'master';
            
            if (currentContent === 'addition') {
                // 三位数加减混合运算
                for (let i = 0; i < 3; i++) {
                    currentQuestions.push(generateAdditionQuestion(isMasterMode));
                }
            } else {
                // 表内乘法四则混合运算
                for (let i = 0; i < 3; i++) {
                    currentQuestions.push(generateMultiplicationQuestion(isMasterMode));
                }
            }
        }

        // 生成三位数加减混合运算（包含小括号）
        function generateAdditionQuestion(isMasterMode = false) {
            // 大师模式生成四步运算
            if (isMasterMode) {
                return generateFourStepAdditionQuestion();
            }
            
            const num1 = Math.floor(Math.random() * 900) + 100; // 100-999
            const num2 = Math.floor(Math.random() * 900) + 100;
            const num3 = Math.floor(Math.random() * 900) + 100;
            
            // 50%概率生成带小括号的题目
            const useParentheses = Math.random() < 0.5;
            
            if (useParentheses) {
                // 带小括号的题目
                const templates = [
                    // 后两个数有括号
                    { q: (a, b, c) => `${a} + (${b} + ${c})`, a: (a, b, c) => a + (b + c) },
                    { q: (a, b, c) => `${a} + (${b} - ${c})`, a: (a, b, c) => a + (b - c) },
                    { q: (a, b, c) => `${a} - (${b} + ${c})`, a: (a, b, c) => a - (b + c) },
                    { q: (a, b, c) => `${a} - (${b} - ${c})`, a: (a, b, c) => a - (b - c) },
                    // 前两个数有括号
                    { q: (a, b, c) => `(${a} + ${b}) + ${c}`, a: (a, b, c) => (a + b) + c },
                    { q: (a, b, c) => `(${a} + ${b}) - ${c}`, a: (a, b, c) => (a + b) - c },
                    { q: (a, b, c) => `(${a} - ${b}) + ${c}`, a: (a, b, c) => (a - b) + c },
                    { q: (a, b, c) => `(${a} - ${b}) - ${c}`, a: (a, b, c) => (a - b) - c }
                ];
                
                const template = templates[Math.floor(Math.random() * templates.length)];
                const question = template.q(num1, num2, num3);
                const answer = template.a(num1, num2, num3);
                
                return { question, answer };
            } else {
                // 不带小括号的题目
                const operators = [
                    ['+', '+'],
                    ['+', '-'],
                    ['-', '+'],
                    ['-', '-']
                ];
                const ops = operators[Math.floor(Math.random() * operators.length)];
                
                const question = `${num1} ${ops[0]} ${num2} ${ops[1]} ${num3}`;
                let answer = num1;
                if (ops[0] === '+') answer += num2;
                else answer -= num2;
                if (ops[1] === '+') answer += num3;
                else answer -= num3;
                
                return { question, answer };
            }
        }

        // 生成四步加减混合运算（大师模式）
        function generateFourStepAdditionQuestion() {
            const num1 = Math.floor(Math.random() * 900) + 100; // 100-999
            const num2 = Math.floor(Math.random() * 900) + 100;
            const num3 = Math.floor(Math.random() * 900) + 100;
            const num4 = Math.floor(Math.random() * 900) + 100;
            const num5 = Math.floor(Math.random() * 900) + 100;
            
            // 四步运算模板（带小括号）
            const templates = [
                // 一个括号包含两个数
                { q: (a, b, c, d, e) => `(${a} + ${b}) + ${c} - ${d} + ${e}`, a: (a, b, c, d, e) => (a + b) + c - d + e },
                { q: (a, b, c, d, e) => `(${a} - ${b}) + ${c} + ${d} - ${e}`, a: (a, b, c, d, e) => (a - b) + c + d - e },
                { q: (a, b, c, d, e) => `${a} + (${b} + ${c}) - ${d} + ${e}`, a: (a, b, c, d, e) => a + (b + c) - d + e },
                { q: (a, b, c, d, e) => `${a} - (${b} - ${c}) + ${d} - ${e}`, a: (a, b, c, d, e) => a - (b - c) + d - e },
                { q: (a, b, c, d, e) => `${a} + ${b} - (${c} + ${d}) + ${e}`, a: (a, b, c, d, e) => a + b - (c + d) + e },
                { q: (a, b, c, d, e) => `${a} - ${b} + (${c} - ${d}) + ${e}`, a: (a, b, c, d, e) => a - b + (c - d) + e },
                // 两个括号
                { q: (a, b, c, d, e) => `(${a} + ${b}) + (${c} - ${d}) + ${e}`, a: (a, b, c, d, e) => (a + b) + (c - d) + e },
                { q: (a, b, c, d, e) => `(${a} - ${b}) - (${c} - ${d}) + ${e}`, a: (a, b, c, d, e) => (a - b) - (c - d) + e },
                { q: (a, b, c, d, e) => `${a} + (${b} + ${c}) - (${d} + ${e})`, a: (a, b, c, d, e) => a + (b + c) - (d + e) },
                { q: (a, b, c, d, e) => `${a} - (${b} - ${c}) + (${d} - ${e})`, a: (a, b, c, d, e) => a - (b - c) + (d - e) },
            ];
            
            const template = templates[Math.floor(Math.random() * templates.length)];
            const question = template.q(num1, num2, num3, num4, num5);
            const answer = template.a(num1, num2, num3, num4, num5);
            
            return { question, answer };
        }

        // 生成表内乘法和除法的四则混合运算（两步运算）

                        const quotient = Math.floor(Math.random() * 9) + 1; // 商1-9
                        const a = b * quotient; // 被除数最大81

                {

                        const diff = c * quotient;

                        const b = Math.floor(Math.random() * 9) + 1;

                        return { question: `${a} × ${b} + ${c}`, answer: product + c };

                {
                    q: () => {

                        const a = b * quotient; // 被除数最大81
                        // 确保 c - d < quotient
                        const c = Math.floor(Math.random() * Math.max(quotient - 2, 1)) + 1;

        // 渲染题目
        function renderQuestions() {
            const container = document.getElementById('questionsContainer');
            container.innerHTML = '';
            
            currentQuestions.forEach((q, index) => {
                const questionDiv = document.createElement('div');
                questionDiv.className = 'question-item';
                questionDiv.innerHTML = `
                    <div class="question-text">第 ${index + 1} 题: ${q.question} = ?</div>
                    <input type="number" inputmode="numeric" pattern="[0-9]*" class="answer-input" id="answer${index}" 
                           placeholder="请输入答案">
                    <div class="error-mark" id="error${index}">❌ 这道题答错了</div>
                `;
                container.appendChild(questionDiv);
            });
            
            // 清空提示信息
            document.getElementById('messageBox').classList.remove('show');
        }

        // 提交答案
        function submitAnswers() {
            const userAnswers = [];
            const errorIndexes = [];
            
            // 收集用户答案并检查
            currentQuestions.forEach((q, index) => {
                const input = document.getElementById(`answer${index}`);
                const userAnswer = parseInt(input.value);
                userAnswers.push(userAnswer);
                
                if (userAnswer !== q.answer) {
                    errorIndexes.push(index);
                }
            });
            
            // 清除之前的错误标记
            document.querySelectorAll('.question-item').forEach(item => {
                item.classList.remove('error');
            });
            document.querySelectorAll('.error-mark').forEach(mark => {
                mark.classList.remove('show');
            });
            document.querySelectorAll('.answer-input').forEach(input => {
                input.classList.remove('error');
            });
            
            const messageBox = document.getElementById('messageBox');
            
            if (errorIndexes.length === 0) {
                // 全部正确
                completeTraining();
            } else {
                // 有错误
                if (currentMode === 'easy') {
                    // 简单模式：标记错题
                    errorIndexes.forEach(index => {
                        document.querySelector(`#answer${index}`).closest('.question-item').classList.add('error');
                        document.getElementById(`error${index}`).classList.add('show');
                        document.getElementById(`answer${index}`).classList.add('error');
                    });
                    
                    messageBox.textContent = '你有题目答错了，请修改后再提交。';
                    messageBox.className = 'message-box error show';
                } else if (currentMode === 'hard') {
                    // 困难模式：只提示错误数量
                    messageBox.textContent = `你提交的答案中，有 ${errorIndexes.length} 道是错误的，请自己检查一遍，修改后再提交。`;
                    messageBox.className = 'message-box show';
                } else {
                    // 大师模式：只提示错误数量
                    messageBox.textContent = `你提交的答案中，有 ${errorIndexes.length} 道是错误的，请自己检查一遍，修改后再提交。`;
                    messageBox.className = 'message-box show';
                }
            }
        }

        // 完成训练
        function completeTraining() {
            const oldLevel = getTreeLevel(totalPoints);
            
            // 增加积分
            let pointsEarned;
            if (currentMode === 'easy') {
                pointsEarned = 1;
            } else if (currentMode === 'hard') {
                pointsEarned = 2;
            } else {
                pointsEarned = 3; // 大师模式
            }
            totalPoints += pointsEarned;
            
            // 保存进度
            saveProgress();
            
            // 更新完成页面
            document.getElementById('pointsAnimation').textContent = `+${pointsEarned} 分`;
            document.getElementById('currentPoints').textContent = totalPoints;
            
            // 显示完成页面
            showPage('completionPage');
            
            // 检查是否升级
            const newLevel = getTreeLevel(totalPoints);
            if (newLevel.minPoints !== oldLevel.minPoints) {
                setTimeout(() => {
                    showLevelUp(newLevel);
                }, 1000);
            }
        }

        // 显示升级动画
        function showLevelUp(level) {
            document.getElementById('levelUpTree').textContent = level.emoji;
            document.getElementById('levelUpText').textContent = level.name;
            document.getElementById('levelUpOverlay').classList.add('show');
        }

        // 关闭升级动画
        function closeLevelUp() {
            document.getElementById('levelUpOverlay').classList.remove('show');
            updateTreeDisplay();
        }

        // 下一组
        function nextRound() {
            updateTreeDisplay();
            showPage('selectionPage');
        }

        // 返回主页
        function goHome() {
            updateTreeDisplay();
            showPage('homePage');
        }

        // 返回选择页面
        function backToSelection() {
            // 清空答题界面的数据和状态
            document.getElementById('messageBox').classList.remove('show');
            document.querySelectorAll('.question-item').forEach(item => {
                item.classList.remove('error');
            });
            document.querySelectorAll('.error-mark').forEach(mark => {
                mark.classList.remove('show');
            });
            document.querySelectorAll('.answer-input').forEach(input => {
                input.classList.remove('error');
            });
            
            // 返回选择页面
            showPage('selectionPage');
        }

        // 页面加载时初始化
        window.addEventListener('load', init);
    </script>
</body>
</html>
