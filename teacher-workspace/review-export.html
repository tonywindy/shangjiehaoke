<link rel="stylesheet" href="workspace-shell.css">
<style>
:root{--green:#1e9455;--green-d:#177f48;--green-l:#eaf5ee;--green-l2:#f3faf5;--cream:#faf8f2;--page:#fbfaf7;--card:#fff;--line:#ecebe5;--line-2:#f3f2ec;--text:#25282c;--text-2:#666d75;--text-3:#9aa0a7;--red:#df4d43;--red-l:#fdedeb;--amber:#e0a020;--amber-l:#fdf6e6;--blue:#4a86d6;--blue-l:#edf3fc;--orange:#e8833a;--orange-l:#fdf1e7;--sh:0 2px 10px rgba(35,38,42,.06)}
*{box-sizing:border-box}body{margin:0;background:var(--page);color:var(--text);font:14px/1.65 "PingFang SC","HarmonyOS Sans SC","Microsoft YaHei",sans-serif}button,input,select{font:inherit;color:inherit}button{cursor:pointer}a{color:inherit;text-decoration:none}.app{display:flex;min-height:100vh}.main{min-width:0;flex:1}.body{padding:22px 24px 40px}.intro{display:flex;align-items:center;gap:16px;margin-bottom:16px;padding:17px 20px;border:1px solid #d4e7da;border-radius:14px;background:linear-gradient(90deg,#f3faf5,#fff)}.intro .ic{width:40px;height:40px;display:grid;place-items:center;border-radius:12px;background:var(--green);color:#fff;font-size:20px}.intro h1{margin:0;font-size:20px}.intro p{margin:2px 0 0;color:var(--text-2)}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}.pane{min-width:0;margin-bottom:16px;border:1px solid var(--line);border-radius:14px;background:#fff;box-shadow:0 1px 2px rgba(35,38,42,.04)}.ph{display:flex;align-items:center;gap:11px;padding:15px 18px;border-bottom:1px solid var(--line-2)}.ph .ic{width:31px;height:31px;display:grid;place-items:center;border-radius:9px}.ph h2{margin:0;font-size:16.5px}.ph .grow{flex:1}.pane-copy{padding:18px}.pane-copy p{margin:0 0 14px;color:var(--text-2)}.field{display:grid;gap:6px;margin-bottom:13px}.field span{color:var(--text-2);font-size:12.5px}.field select{width:100%;height:40px;padding:0 11px;border:1px solid var(--line);border-radius:10px;background:#fff}.tbtn{height:38px;display:inline-flex;align-items:center;justify-content:center;gap:7px;padding:0 14px;border:1px solid var(--line);border-radius:9px;background:#fff;color:var(--text-2)}.tbtn:hover{border-color:#d7d4ca;color:var(--text)}.tbtn.g{border-color:var(--green);background:var(--green);color:#fff;font-weight:600}.tbtn.danger{border-color:#efc5c1;background:var(--red-l);color:var(--red)}.hide{display:none}.output{grid-column:1/-1}.paper{margin:20px auto;padding:0;max-width:920px;border:1px solid #e0ddd4;border-radius:12px;background:#fff;box-shadow:0 10px 35px -18px rgba(35,38,42,.25);overflow:hidden}.paper .hd{padding:30px 36px 24px;text-align:center;border-bottom:1px solid var(--line);background:linear-gradient(180deg,#f8fcf9,#fff)}.paper .hd .k{color:var(--green);font-size:11px;font-weight:700;letter-spacing:.28em}.paper .hd h3{margin:7px 0 3px;font-size:24px}.paper .hd .m{color:var(--text-3);font-size:12px}.paper .bd{padding:28px 36px}.paper .sec+.sec{margin-top:24px}.paper .sec h4{display:flex;align-items:center;gap:8px;margin:0 0 11px;font-size:16px}.paper .sec h4 .d{width:8px;height:8px;border-radius:50%;background:var(--green)}.paper .sec p{margin:0;color:var(--text-2)}.paper .stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.paper .stat{padding:15px;border:1px solid var(--line);border-radius:10px;background:#fbfaf7;text-align:center}.paper .stat .n{font-size:24px;font-weight:700}.paper .stat .l{color:var(--text-3);font-size:11.5px}.paper .li{display:flex;gap:9px;padding:8px 0;color:var(--text-2)}.paper .li .b{width:7px;height:7px;margin-top:8px;border-radius:50%;background:var(--green);flex:none}.vs{display:grid;grid-template-columns:1fr 1fr;gap:14px;padding:18px}.vsc{padding:18px;border:1px solid var(--line);border-radius:12px}.vsc.me{background:#fbfaf7}.vsc.pa{border-color:#cfe5d6;background:var(--green-l2)}.vsc .t{margin-bottom:10px;font-weight:700}.vsc .c{color:var(--text-2);line-height:1.8}.vsnote{margin:0 18px 18px;padding:12px 14px;border-radius:10px;background:#f4f3ee;color:var(--text-2);font-size:12.5px}
.backup-pane{grid-column:1/-1}.backup-content{padding:18px}.backup-scope{display:flex;gap:7px;margin-bottom:13px}.backup-scope button{padding:7px 12px;border:1px solid var(--line);border-radius:8px;background:#fff;color:var(--text-2)}.backup-scope button.on{border-color:#afd4bb;background:var(--green-l);color:var(--green-d);font-weight:600}.backup-summary{padding:14px;border:1px solid var(--line);border-radius:11px;background:#fbfaf7}.backup-summary h3{margin:0 0 4px;font-size:15px}.backup-summary p{margin:0;color:var(--text-2)}.backup-counts{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:12px}.backup-count{padding:10px;border:1px solid var(--line);border-radius:9px;background:#fff;text-align:center}.backup-count b{display:block;font-size:20px}.backup-count span{color:var(--text-3);font-size:11px}.backup-actions{display:flex;align-items:center;gap:9px;flex-wrap:wrap;margin-top:14px}.file-button{position:relative;height:38px;display:inline-flex;align-items:center;padding:0 14px;border:1px solid var(--line);border-radius:9px;background:#fff;color:var(--text-2);cursor:pointer}.file-button input{position:absolute;inset:0;opacity:0;cursor:pointer}
.restore-dialog{width:min(620px,calc(100vw - 32px));padding:0;border:0;border-radius:17px;color:var(--text);box-shadow:0 24px 70px -15px rgba(35,38,42,.36)}.restore-dialog::backdrop{background:rgba(26,30,28,.42);backdrop-filter:blur(3px)}.restore-head{display:flex;align-items:flex-start;gap:12px;padding:19px 22px;border-bottom:1px solid var(--line)}.restore-head h2{margin:0;font-size:18px}.restore-head p{margin:2px 0 0;color:var(--text-3);font-size:12px}.restore-head .grow{flex:1}.restore-main{padding:17px 22px}.restore-summary{padding:12px;border-radius:10px;background:#f4f3ee}.restore-summary b,.restore-summary span{display:block}.restore-summary span{margin-top:3px;color:var(--text-2);font-size:12px}.restore-options{display:grid;gap:8px;margin-top:13px}.restore-option{display:flex;align-items:flex-start;gap:9px;padding:12px;border:1px solid var(--line);border-radius:10px}.restore-option input{margin-top:4px}.restore-option span{display:grid}.restore-option i{margin-top:2px;color:var(--text-3);font-style:normal;font-size:12px}.restore-warning{min-height:20px;margin-top:10px;color:var(--red);font-size:12px}.restore-foot{display:flex;justify-content:flex-end;gap:8px;padding:13px 22px;border-top:1px solid var(--line)}.toast{position:fixed;left:50%;bottom:28px;z-index:150;transform:translate(-50%,14px);padding:10px 18px;border-radius:11px;background:#25282c;color:#fff;opacity:0;pointer-events:none;transition:.25s}.toast.on{opacity:1;transform:translate(-50%,0)}
@media(max-width:900px){.grid{grid-template-columns:1fr}.output,.backup-pane{grid-column:1}.paper .stats{grid-template-columns:repeat(2,1fr)}.vs{grid-template-columns:1fr}}
@media print{.side,.top,.intro,.grid>.pane:not(.output){display:none!important}.body{padding:0}.paper{max-width:none;margin:0;border:0;box-shadow:none}}
</style>

<body>
<div class="app">

    <div class="grow"></div><a class="navmini on" href="review-export.html"><span>▤</span>回顾与导出</a><button class="kbtn" type="button" data-kopen><span>⌕</span>搜索<span class="kk">⌘K</span></button>
  </aside>
  <main class="main">
    <header class="top"><div class="title">上节好课 · 教师工作台</div><div class="grow"></div><div class="date"><span>▣</span><span id="dT"></span><span id="dW"></span></div><button class="picker">四年级1班 <span>⌄</span></button><label class="search"><span>⌕</span><input placeholder="搜索学生、内容、知识点"></label></header>
    <div class="body">
      <section class="intro"><span class="ic">✓</span><div><h1>回顾与导出</h1><p>只用已经保存的真实记录生成班级回顾和学生评价；没有数据的内容不会被编造。</p></div></section>
      <div class="grid">
        <section class="pane"><div class="ph"><span class="ic" style="background:var(--green-l);color:var(--green)">班</span><h2>班级阶段回顾</h2></div><div class="pane-copy"><p>汇总当前班级的学生、学情判断、作业、任务和班级记录。</p><button class="tbtn g" id="genReview" type="button">生成班级回顾</button></div></section>
        <section class="pane"><div class="ph"><span class="ic" style="background:var(--blue-l);color:var(--blue)">生</span><h2>学生阶段评价</h2></div><div class="pane-copy"><label class="field"><span>选择学生</span><select id="stuSel"></select></label><button class="tbtn g" id="genStu" type="button">生成学生评价</button></div></section>
        <section class="pane output hide" id="reviewDoc"><div class="ph"><span class="ic" style="background:var(--green-l);color:var(--green)">回</span><h2>班级阶段回顾</h2><span class="grow"></span><button class="tbtn" type="button" onclick="window.print()">打印 / 保存为 PDF</button></div><div class="paper"></div></section>
        <section class="pane output hide" id="stuDoc"><div class="ph"><span class="ic" style="background:var(--blue-l);color:var(--blue)">评</span><h2 id="stuT">学生阶段评价</h2><span class="grow"></span><button class="tbtn" type="button" onclick="window.print()">打印 / 保存为 PDF</button></div><div></div></section>
        <section class="pane backup-pane" id="workspaceBackupPane"><div class="ph"><span class="ic" style="background:var(--orange-l);color:var(--orange)">备</span><h2>班级数据备份与恢复</h2></div><div class="backup-content"><div class="backup-scope" role="group" aria-label="备份范围"><button type="button" class="on" data-backup-scope="current">当前班级</button><button type="button" data-backup-scope="all">全部班级</button></div><div class="backup-summary"><h3 id="backupCurrentClass">当前班级</h3><p id="backupScopeCopy">正在读取本机数据…</p><div class="backup-counts" id="backupCounts"></div></div><div class="backup-actions"><button class="tbtn g" type="button" id="exportWorkspaceBackup"><span id="exportWorkspaceLabel">导出当前班级备份</span></button><label class="file-button"><input type="file" id="workspaceRestoreFile" accept=".json,application/json"><span>选择备份文件恢复</span></label></div></div></section>
      </div>
    </div>
  </main>
</div>
<dialog class="restore-dialog" id="workspaceRestoreDialog"><div class="restore-head"><div><h2>确认恢复内容</h2><p>先核对备份，再决定恢复到哪里。</p></div><span class="grow"></span><button class="tbtn" type="button" id="closeWorkspaceRestore">关闭</button></div><div class="restore-main"><div class="restore-summary" id="workspaceRestoreSummary"></div><div class="restore-options" id="workspaceRestoreOptions"></div><div class="restore-warning" id="workspaceRestoreWarning"></div></div><div class="restore-foot"><button class="tbtn" type="button" id="cancelWorkspaceRestore">取消</button><button class="tbtn g" type="button" id="confirmWorkspaceRestore">确认恢复</button></div></dialog>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
