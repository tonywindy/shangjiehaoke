<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>任务 · 上节好课教师工作台</title>
<style>
:root{
  --green:#1a8050; --green-d:#146a41; --green-l:#eaf4ee; --green-l2:#f4faf6;
  --cream:#faf8f2; --page:#fbfaf7; --card:#fff;
  --line:#ecebe5; --line-2:#f3f2ec;
  --text:#23262a; --text-2:#666d75; --text-3:#9aa0a7;
  --red:#df4d43; --red-l:#fdedeb;
  --amber:#e0a020; --amber-l:#fdf6e6;
  --blue:#4a86d6; --blue-l:#edf3fc;
  --purple:#8e6fc4; --purple-l:#f3eefb;
  --orange:#e8833a; --orange-l:#fdf1e7;
  --sh-1:0 1px 2px rgba(35,38,42,.04);
  --sh-2:0 2px 10px rgba(35,38,42,.07);
  --sh-3:0 8px 28px -8px rgba(35,38,42,.16);
  --ease:cubic-bezier(.32,.72,0,1);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--page);color:var(--text);
  font:14px/1.6 -apple-system,BlinkMacSystemFont,"PingFang SC","HarmonyOS Sans SC","Microsoft YaHei",sans-serif;
  -webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer;padding:0}
input{font:inherit;color:inherit}
a{color:inherit;text-decoration:none}
svg{display:block}
::selection{background:var(--green);color:#fff}
.app{display:flex;min-height:100vh}

/* ===== 一级栏 ===== */
.side{width:196px;flex:none;background:var(--cream);border-right:1px solid var(--line);
  display:flex;flex-direction:column;padding:0 14px 18px;position:sticky;top:0;height:100vh}
.brand{display:flex;align-items:center;gap:10px;padding:20px 6px 24px}
.brand .bt{font-size:17px;font-weight:700;letter-spacing:.5px;line-height:1.15}
.brand .bs{font-size:10.5px;letter-spacing:.32em;color:var(--text-3);margin-top:3px}
.nav{display:flex;flex-direction:column;gap:4px}
.nav a{display:flex;align-items:center;gap:11px;padding:11px 14px;border-radius:11px;
  color:#4c545c;font-size:15px;transition:.2s var(--ease)}
.nav a:hover{background:#f1eee4;color:var(--text)}
.nav a.on{background:var(--green);color:#fff;font-weight:600;box-shadow:0 4px 12px -3px rgba(26,128,80,.42)}
.side .grow{flex:1}

/* ===== 顶栏 ===== */
.main{flex:1;min-width:0;display:flex;flex-direction:column}
.top{height:76px;flex:none;display:flex;align-items:center;gap:14px;padding:0 26px;background:#fff;border-bottom:1px solid var(--line)}
.top h1{margin:0;font-size:25px;font-weight:700;letter-spacing:-.02em}
.top .grow{flex:1}
.date{display:flex;align-items:center;gap:8px;color:var(--text-2);font-size:14px}
.picker{display:flex;align-items:center;gap:8px;height:38px;padding:0 13px;border:1px solid var(--line);
  border-radius:10px;font-size:14px;transition:.18s var(--ease)}
.picker:hover{border-color:#dcdad2;background:#fcfbf8}
.search{display:flex;align-items:center;gap:9px;height:38px;width:238px;padding:0 13px;
  border:1px solid var(--line);border-radius:10px;color:var(--text-3);transition:.2s var(--ease)}
.search:focus-within{border-color:var(--green);box-shadow:0 0 0 3px rgba(26,128,80,.1)}
.search input{border:none;outline:none;background:none;flex:1;font-size:14px}
.search input::placeholder{color:var(--text-3)}

/* ===== 任务视图 ===== */
.cols{display:grid;grid-template-columns:228px minmax(0,1fr);gap:16px;padding:20px 24px 34px;align-items:start}
.pane{background:var(--card);border:1px solid var(--line);border-radius:14px;box-shadow:var(--sh-1)}

/* --- 视图栏 --- */
.vpane{padding:10px;position:sticky;top:20px}
.vi{display:flex;align-items:center;gap:10px;padding:9px 11px;border-radius:10px;width:100%;text-align:left;
  font-size:14.5px;color:#4c545c;transition:.16s var(--ease)}
.vi:hover{background:#f7f6f1;color:var(--text)}
.vi.on{background:var(--green-l);color:var(--green-d);font-weight:600}
.vi .ic{width:18px;flex:none;display:grid;place-items:center}
.vi .nm{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.vi .ct{font-size:12.5px;color:var(--text-3);font-variant-numeric:tabular-nums}
.vi.on .ct{color:var(--green)}
.vsep{height:1px;background:var(--line-2);margin:9px 6px}
.vi.frag{border:1px solid #cfe6d9;background:var(--green-l2);color:var(--green-d);font-weight:600;margin:2px 0}
.vi.frag:hover{background:var(--green-l)}

/* --- 主列表 --- */
.lh{display:flex;align-items:center;gap:12px;padding:16px 18px 14px;border-bottom:1px solid var(--line-2)}
.lh h2{margin:0;font-size:21px;font-weight:700;letter-spacing:-.02em}
.lh .done{font-size:13.5px;color:var(--text-2)}
.lh .done b{color:var(--green);font-weight:700}
.lh .grow{flex:1}
.tbtn{display:flex;align-items:center;gap:6px;height:34px;padding:0 12px;border:1px solid var(--line);
  border-radius:9px;font-size:13.5px;color:var(--text-2);transition:.18s var(--ease)}
.tbtn:hover{border-color:#dcdad2;color:var(--text);background:#fcfbf8}

/* 快速添加 */
.qwrap{padding:14px 16px 6px}
.qa{border:1.6px solid var(--green);border-radius:11px;overflow:hidden;background:#fff;transition:.2s var(--ease)}
.qa.idle{border-color:var(--line)}
.qrow1{display:flex;align-items:center;gap:10px;padding:13px 14px}
.qrow1 input{flex:1;border:none;outline:none;background:none;font-size:15.5px}
.qrow1 input::placeholder{color:#b2b7bc}
.qclear{width:26px;height:26px;border-radius:8px;display:grid;place-items:center;color:var(--text-3);flex:none;transition:.16s var(--ease)}
.qclear:hover{background:#f2f1ea;color:var(--text)}
.qrow2{display:flex;align-items:center;gap:9px;padding:0 14px 13px;flex-wrap:wrap}
.pc{display:inline-flex;align-items:center;gap:6px;height:32px;padding:0 12px;border-radius:9px;
  font-size:13.5px;font-weight:500;background:#f4f3ee;color:var(--text-2)}
.pc.d{background:var(--green-l);color:var(--green-d)}
.pc.s{background:#f4f3ee;color:var(--text-2)}
.pc.p{background:var(--red-l);color:var(--red)}
.qadd{margin-left:auto;height:34px;padding:0 17px;border-radius:9px;background:var(--green);color:#fff;
  font-size:14px;font-weight:600;box-shadow:0 3px 10px -3px rgba(26,128,80,.5);transition:.18s var(--ease)}
.qadd:hover{background:var(--green-d)}
.qadd.off{opacity:.4;pointer-events:none;box-shadow:none}
.qhint{padding:0 16px 12px;font-size:12.5px;color:var(--text-3)}

/* 分节标题 */
.sec{padding:14px 18px 6px;font-size:14.5px;font-weight:650}
.sec.od{color:var(--red)}

/* 任务行 */
.rows{padding:0 8px}
.tk{display:flex;align-items:center;gap:10px;padding:11px 10px;border-radius:10px;position:relative;
  transition:background .16s var(--ease);cursor:pointer}
.tk:hover{background:#fbfaf7}
.tk.auto-homework-task{margin-bottom:4px;padding-left:8px;border-left:3px solid var(--green);background:var(--green-l2)}
.tk.auto-homework-task:hover{background:var(--green-l)}
.tk.auto-homework-task .tbox{pointer-events:none;cursor:default}
.tk+.tk{box-shadow:0 -1px 0 var(--line-2)}
.tbox{width:20px;height:20px;border-radius:50%;border:1.8px solid #d5d9dd;flex:none;
  display:grid;place-items:center;transition:.2s var(--ease)}
.tbox:disabled{cursor:not-allowed;opacity:.65}
.tbox svg{opacity:0;transform:scale(.5);transition:.22s var(--ease);stroke:#fff}
.tbox:hover{border-color:var(--green)}
.tk.done .tbox{background:var(--green);border-color:var(--green)}
.tk.done .tbox svg{opacity:1;transform:none}
.tk .tt{font-size:14.8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:270px}
.tk.done .tt{color:var(--text-3);text-decoration:line-through}
.tk .grow{flex:1}
.chip{display:inline-flex;align-items:center;gap:5px;font-size:12.5px;padding:3px 9px;border-radius:8px;
  background:#f4f3ee;color:var(--text-2);white-space:nowrap;flex:none}
.chip.stu{background:#f4f3ee;color:var(--text-2)}
.chip.kp{background:#f4f3ee;color:var(--text-2)}
.chip.src{background:#f4f3ee;color:var(--text-2)}
.chip.src svg{color:#a8aeb4}
.due{font-size:13px;color:var(--green);font-variant-numeric:tabular-nums;flex:none;white-space:nowrap}
.due.od{color:var(--red);font-weight:600}
.due.gray{color:var(--text-3)}
.dots{width:26px;height:26px;border-radius:8px;display:grid;place-items:center;color:#b8bdc2;flex:none;
  opacity:0;transition:.16s var(--ease)}
.tk:hover .dots{opacity:1}
.dots:hover{background:#f0efe9;color:var(--text)}
.exp{width:26px;height:26px;border-radius:8px;display:grid;place-items:center;color:#b8bdc2;flex:none;transition:.18s var(--ease)}
.exp:hover{background:#f0efe9;color:var(--text)}
.exp svg{transition:transform .26s var(--ease)}
.tk.open .exp svg{transform:rotate(180deg)}


/* 面板 */
.scrim{position:fixed;inset:0;background:rgba(28,30,32,.3);backdrop-filter:blur(2px);opacity:0;pointer-events:none;
  transition:.3s var(--ease);z-index:40}
.scrim.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;top:14px;right:14px;bottom:14px;width:min(452px,calc(100vw - 28px));background:#fff;
  border-radius:16px;box-shadow:var(--sh-3);z-index:41;display:flex;flex-direction:column;
  transform:translateX(calc(100% + 24px));transition:transform .42s var(--ease)}
.sheet.on{transform:none}
.sheet header{display:flex;align-items:flex-start;gap:12px;padding:20px 22px 12px}
.sheet header h3{margin:0;font-size:18px;font-weight:660;flex:1;line-height:1.42}
.sheet .sb{flex:1;overflow:auto;padding:0 22px 22px}
.sheet .sb::-webkit-scrollbar{width:7px}
.sheet .sb::-webkit-scrollbar-thumb{background:#e6e4dc;border-radius:4px}
.frow{display:flex;gap:12px;padding:11px 0;border-bottom:1px solid var(--line-2);font-size:14px}
.frow .k{color:var(--text-3);width:72px;flex:none}
.frow .v{flex:1}
.pnl{background:#fbfaf7;border:1px solid var(--line);border-radius:12px;padding:14px;margin:12px 0}
.pnl .pt{font-size:11.5px;font-weight:600;color:var(--text-3);letter-spacing:.07em;margin-bottom:10px}
.acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.act{height:36px;padding:0 15px;border-radius:10px;background:#f4f3ee;font-size:13.8px;font-weight:500;transition:.18s var(--ease)}
.act:hover{background:#eae8e0}
.act.pri2{background:var(--green);color:#fff;box-shadow:0 3px 10px -3px rgba(26,128,80,.5)}
.act.pri2:hover{background:var(--green-d)}
.act.danger{color:var(--red)}
.toast{position:fixed;left:50%;bottom:28px;transform:translate(-50%,14px);background:#23262a;color:#fff;font-size:13.5px;
  padding:10px 18px;border-radius:11px;box-shadow:var(--sh-3);opacity:0;pointer-events:none;transition:.3s var(--ease);z-index:60}
.toast.on{opacity:1;transform:translate(-50%,0)}
@media(max-width:920px){.cols{grid-template-columns:1fr}.vpane{position:static}}
</style>
