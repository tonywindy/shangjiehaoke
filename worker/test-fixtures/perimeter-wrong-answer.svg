  <text x="825" y="465" font-family="PingFang SC, sans-serif" font-size="32" fill="#222">5米</text>
  <text x="150" y="690" font-family="KaiTi, STKaiti, serif" font-size="50" fill="#1859a9">答：8 + 5 = 13（米）</text>
