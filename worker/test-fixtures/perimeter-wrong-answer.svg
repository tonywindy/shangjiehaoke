  <text x="110" y="245" font-family="PingFang SC, sans-serif" font-size="34" fill="#222">3. 给下面的长方形花圃围一圈篱笆，需要多少米？</text>
  <rect x="360" y="325" width="440" height="250" fill="#f7fbf3" stroke="#2d6a4f" stroke-width="8"/>
