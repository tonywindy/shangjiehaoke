er:1.5px dashed var(--accent);background:var(--wash);color:var(--accent);border-radius:9px;height:36px;font-size:15px;font-weight:800}.hintbtn:disabled{opacity:.45}.hintbtn+.submit{margin-top:6px}@media(min-width:1000px) and (max-height:850px){.hintbtn{height:30px;font-size:14px;margin-top:5px}}</style></head><body><main class="wrap"><header><div class="brand"><div class="logo">×</div><div><strong>竖式大比拼</strong><small>MULTIPLICATION ARENA</small></div></div><div class="toolbar"><button class="btn" id="help">? 玩法</button><button class="btn" id="fullscreen">⛶ 全屏</button></div></header><section class="intro"><div><div class="eyebrow">小小算术家 · 同屏挑战</div><h1>认真计算，<span>一起出彩。</span></h1><p class="subtitle">一人练习，多人比拼。让每一步计算，都成为进步。</p></div><div class="decor">12 × 24</div></section><section class="settings" aria-label="比赛设置"><div class="field">参赛人数<div class="seg" id="players"></div></div><label class="field">题型<select id="type"><option value="2x1">两位数 × 一位数</option><option value="2x2">两位数 × 两位数</option><option value="3x2">三位数 × 两位数</option><option value="mix">三种混合</option><option value="tens">整十数专项（先算再补0）</option></select></label><label class="field">每人题数<select id="goal"><option value="5">5 题</option><option value="8" selected>8 题</option><option value="10">10 题</option><option value="15">15 题</option></select></label><button class="btn primary start" id="start">开始比赛 ↗</button></section><div class="arena-heading"><div class="live"><i class="dot"></i><span id="state">赛场已就绪</span></div><div><span id="timer" class="clock">00:00</span><button id="pause" class="btn" style="margin-left:12px;padding:6px 12px" disabled>暂停</button><button id="stop" class="btn stop" disabled>结束比赛</button></div></div><section id="arena" class="arena" aria-label="比赛答题区"></section><footer><div class="help"><span><b>01</b> 从个位开始填写</span><span><b>02</b> 点击方格可修改</span><span><b>03</b> 完成竖式后提交</span></div><span class="status-pill">✦ 同一题组 · 随机顺序</span></footer></main><div class="modal" id="modal" hidden><div class="dialog" id="dialog"></div></div><div class="toast" id="toast" role="status"></div><script>'use strict';
const $=s=>document.querySelector(s);
let practice=false,count=3,goal=8,players=[],questions=[],phase='ready',selected=0,startTime=0,elapsed=0,interval,roundId=0;
const names=['青松队','蓝鲸队','暖阳队','紫星队'];const tx=t=>practice?t.replace('比赛','练习').replace('赛场','练习'):t;
const rand=(a,b)=>Math.floor(Math.random()*(b-a+1))+a;
function question(type){if(type==='mix')type=['2x1','2x2','3x2'][rand(0,2)];let a=type==='3x2'?rand(100,999):rand(10,99),b=type==='2x1'?rand(2,9):type==='tens'?rand(1,9)*10:rand(10,99);return{a:Math.max(a,b),b:Math.min(a,b)};}
function calculation(q){let a=q.a,b=q.b,zeros=0;while(a%10===0){a/=10;zeros++;}while(b%10===0){b/=10;zeros++;}const zA=String(q.a).length-String(a).length,zB=String(q.b).length-String(b).length;return a<b?{a:b,b:a,zeros,zerosA:zB,zerosB:zA}:{a,b,zeros,zerosA:zA,zerosB:zB};}
function expected(q){const {a,b}=calculation(q);return b<10?[String(a*b)]:[String(a*(b%10)),String(a*Math.floor(b/10)),String(a*b)];}
function activeExpected(p){const q=currentQuestion(p);return p.stage==='zeros'?['0'.repeat(calculation(q).zeros)]:expected(q);}
function shuffle(items){const copy=[...items];for(let i=copy.length-1;i>0;i--){const j=rand(0,i);[copy[i],copy[j]]=[copy[j],copy[i]];}return copy;}
function currentQuestion(p){return questions[p.order[Math.min(p.index,goal-1)]];}
function makeOrders(){const usedFirst=new Set();return Array.from({length:count},()=>{const order=shuffle(Array.from({length:goal},(_,i)=>i));const first=order.findIndex(i=>!usedFirst.has(i));[order[0],order[first]]=[order[first],order[0]];usedFirst.add(order[0]);return order;});}
function prepare(){roundId++;clearInterval(interval);phase='ready';elapsed=0;$('#timer').textContent='00:00';goal=+$('#goal').value;questions=[];const seen=new Set();while(questions.length<goal){const q=question($('#type').value),key=q.a+'x'+q.b;if(!seen.has(key)){seen.add(key);questions.push(q);}}const orders=makeOrders();names[0]=practice?'练习小达人':'青松队';players=Array.from({length:count},(_,i)=>({hints:0,perfect:0,qErr:0,qHint:0,wrongRow:-1,order:orders[i],index:0,rows:[],cursor:null,errors:0,finished:null,feedback:'准备好了，开始挑战吧！',good:false}));players.forEach(resetRows);$('#state').textContent=tx('赛场已就绪');$('#start').textContent=tx('开始比赛 ↗');$('#stop').textContent=tx('结束比赛');$('#pause').disabled=true;$('#stop').disabled=true;$('#pause').textContent='暂停';render();}
function resetRows(p){p.stage='core';p.rows=expected(currentQuestion(p)).map(v=>Array(v.length).fill(''));p.cursor=[0,p.rows[0].length-1];}
function numberRow(n,width,sign=''){return '<div class="number">'+(sign?'<span>'+sign+'</span>':'')+String(n).padStart(width,' ').split('').map(x=>'<span>'+x+'</span>').join('')+'</div>';}
function numberRowWithZeros(n,width,sign,zeroCount){const base=numberRow(n,width,sign);if(!zeroCount)return base;const tail='<span class="zero-tail" aria-label="末尾的 '+zeroCount+' 个零">'+Array.from({length:zeroCount},()=>'<span>0</span>').join('')+'</span>';return base.replace('<div class="number">','<div class="number number-with-zeros">').replace('</div>',tail+'</div>');}
function cheer(p,i){const done=p.finished!==null,celebrate=p.good||done,text=done?'太棒啦，完成啦！':phase==='paused'?'休息一下，再出发':p.good?'算得漂亮，继续加油！':p.feedback.includes('检查')?'别着急，再试一次！':['青松青松，稳稳向前！','蓝鲸蓝鲸，乘风前进！','暖阳暖阳，你最闪亮！','紫星紫星，勇敢摘星！'][i];return `<div class="cheer ${celebrate?'celebrating':''} ${phase==='paused'?'resting':''}" aria-label="${names[i]}加油小伙伴"><div class="cheer-buddy" aria-hidden="true"><span class="pom left">✹</span><span class="mascot">${['🌲','🐳','☀️','⭐'][i]}</span><span class="pom right">✹</span></div><div class="cheer-message">${text}</div><span class="cheer-spark" aria-hidden="true">✧</span></div>`;}
function renderMath(p,i){const q=currentQuestion(p),core=calculation(q),adding=p.stage==='zeros',a=adding?q.a:core.a,b=adding?q.b:core.b,width=String(a*b).length;
const cells=(row,r)=>row.map((v,c)=>`<button class="cell ${p.cursor[0]===r&&p.cursor[1]===c?'current':''} ${practice&&p.wrongRow===r&&!(p.cursor[0]===r&&p.cursor[1]===c)?'wrong':''}" data-row="${r}" data-col="${c}" aria-label="${names[i]} ${adding?'末尾补0':('第'+(r+1)+'行')}从左第${c+1}位" ${phase!=='running'?'disabled':''}>${v||'&nbsp;'}</button>`).join('');
const rows=adding?`<div class="answer zero-answer">${String(core.a*core.b).split('').map(v=>'<span class="cell fixed-digit">'+v+'</span>').join('')}${cells(p.rows[0],0)}</div>`:p.rows.map((row,r)=>`${r===2?'<div class="line"></div>':''}<div class="answer">${r===1?'<span class="row-plus">+</span>':''}${cells(row,r)}${r===1?'<span class="shift"></span>':''}</div>`).join('');
return `${core.zeros?'<div class="zero-step">'+(adding?'第2步：在积的末尾补 '+core.zeros+' 个 0':'第1步：先算 '+core.a+' × '+core.b+'，暂不算末尾的 0')+'</div>':''}<div class="math ${!adding&&core.zeros?'with-trailing-zeros':''}" style="--trailing-count:${Math.max(core.zerosA,core.zerosB)}">${!adding&&core.zeros?numberRowWithZeros(a,width,'',core.zerosA):numberRow(a,width)}${!adding&&core.zeros?numberRowWithZeros(b,width,'×',core.zerosB):numberRow(b,width,'×')}<div class="line"></div>${rows}</div><p class="hint zero-hint">${adding?'已算好 '+core.a+' × '+core.b+' = '+(core.a*core.b)+'，现在补 0':core.zeros?'算好后点确认，再补 '+core.zeros+' 个 0':b<10?'从右往左，依次填写答案':'先算个位积，再算十位积，最后求和'}</p>`;}
function render(){const arena=$('#arena');arena.style.setProperty('--count',count);arena.dataset.players=count;const lock=phase==='running'||phase==='paused'||phase==='countdown'?'disabled':'';$('#players').innerHTML=`<button data-practice="1" class="${practice?'active':''}" ${lock}>单人练习</button>`+[1,2,3,4].map(n=>`<button data-count="${n}" class="${!practice&&n===count?'active':''}" ${lock}>${n}人</button>`).join('');arena.innerHTML=players.map((p,i)=>{let q=currentQuestion(p),done=p.finished!==null,width=String(q.a*q.b).length;return `<article class="player ${i===selected?'selected':''}" data-player="${i}">${cheer(p,i)}<div class="player-top"><div class="avatar">${i+1}</div><div><div class="name">${names[i]}</div><div class="tag">PLAYER 0${i+1}</div></div><span class="progress-count">${p.index} / ${goal}</span></div><div class="progress"><i style="width:${p.index/goal*100}%"></i></div><div class="question">${done?'挑战完成 ✓':q.a+' × '+q.b+' = ?'}</div><div class="sheet">${done?`<div class="finish-mark">✦</div><strong>太棒了，全部完成！</strong><p class="hint">用时 ${format(p.finished)} · 错误提交 ${p.errors} 次</p>`:renderMath(p,i)}</div><div class="feedback ${p.good?'good':p.feedback.includes('检查')?'error':''}" aria-live="polite">${p.feedback}</div><div class="keypad">${[7,8,9,'⌫',4,5,6,'清空',1,2,3,0].map(k=>`<button class="key ${typeof k==='string'?'back':''}" data-key="${k}" ${phase!=='running'||done?'disabled':''}>${k==='⌫'?'退位':k}</button>`).join('')}</div>${practice&&!done?`<button class="hintbtn" data-hint ${phase!=='running'?'disabled':''}>💡 提示：帮我填这一格</button>`:''}<button class="submit" data-submit ${phase!=='running'||done?'disabled':''}>${done?'已完成 ✓':p.stage==='zeros'?'补好 0，提交 ✓':calculation(q).zeros?'算好，去补 0 →':'确认答案 ✓'}</button></article>`}).join('');$('#type').disabled=$('#goal').disabled=['running','paused','countdown'].includes(phase);}
function input(i,key){if(phase!=='running')return;let p=players[i];if(p.finished!==null)return;selected=i;let [r,c]=p.cursor;if(key==='清空'){p.rows.forEach(row=>row.fill(''));p.cursor=[0,p.rows[0].length-1];}else if(key==='⌫'){if(p.rows[r][c]===''){if(c<p.rows[r].length-1)c++;else if(r>0){r--;c=0;}}p.rows[r][c]='';p.cursor=[r,c];}else{p.rows[r][c]=String(key);if(c>0)c--;else if(r<p.rows.length-1){r++;c=p.rows[r].length-1;}p.cursor=[r,c];}p.feedback='填写完成后，点击确认答案';p.good=false;p.wrongRow=-1;render();}
function hint(i){if(phase!=='running'||!practice)return;let p=players[i];if(p.finished!==null)return;let [r,c]=p.cursor,d=(activeExpected(p)[r]||'')[c];if(d===undefined)return;p.hints++;p.qHint=1;input(i,d);p.feedback='已填入提示，想一想为什么是这个数';p.good=false;render();}
function submit(i){if(phase!=='running')return;let p=players[i];if(p.finished!==null)return;let incomplete=p.rows.some(row=>row.some(v=>v===''));if(incomplete){p.feedback='请检查：还有方格没有填写';p.good=false;render();return;}let exp=activeExpected(p),bad=p.rows.findIndex((row,r)=>row.join('')!==exp[r]);if(bad!==-1){p.errors++;p.qErr++;p.wrongRow=bad;p.feedback=`请检查第 ${bad+1} 行，再试一次！`;p.good=false;p.cursor=[bad,p.rows[bad].length-1];render();return;}if(p.stage!=='zeros'&&calculation(currentQuestion(p)).zeros){p.stage='zeros';p.rows=[Array(calculation(currentQuestion(p)).zeros).fill('')];p.cursor=[0,p.rows[0].length-1];p.good=true;p.feedback='计算正确！现在把末尾的 0 补上';render();return;}if(!p.qErr&&!p.qHint)p.perfect++;p.qErr=0;p.qHint=0;p.index++;p.good=true;p.feedback='计算正确，继续加油！';if(p.index===goal){p.finished=elapsedNow();p.feedback='全部完成，真棒！';}else resetRows(p);if(players.every(x=>x.finished!==null)){elapsed=elapsedNow();clearInterval(interval);phase='finished';$('#state').textContent=tx('本轮比赛已结束');$('#pause').disabled=true;$('#stop').disabled=true;$('#start').textContent='再来一局 ↗';showResults();}render();}
function format(ms){let s=Math.floor(ms/1000);return String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0');}
function elapsedNow(){return phase==='running'?elapsed+performance.now()-startTime:elapsed;}
function tick(){$('#timer').textContent=format(elapsedNow());}
function modal(html){$('#dialog').innerHTML=html;$('#modal').hidden=false;}
function practiceResults(early){const p=players[0],done=p.index,acc=done?Math.round(p.perfect/done*100):0,msg=acc>=90?'几乎都是一次做对，太厉害了！':acc>=60?'很不错，再多练几题会更稳！':'别着急，多用提示、慢慢算，一定会越来越好。';modal(`<div class="eyebrow">${early?'PRACTICE ENDED':'PRACTICE COMPLETE'}</div><h2>${early?'练习已结束':'练习完成，真棒！'}</h2><p>${msg}</p><div class="result-row"><strong>完成题数</strong><span>${done} / ${goal} 题</span></div><div class="result-row"><strong>一次做对</strong><span>${p.perfect} 题 · 正确率 ${acc}%</span></div><div class="result-row"><strong>用时</strong><span>${format(p.finished===null?elapsed:p.finished)}</span></div><div class="result-row"><strong>错误提交 / 使用提示</strong><span>${p.errors} 次 / ${p.hints} 次</span></div><button class="btn primary" data-close>查看练习</button> <button class="btn" id="again">再练一组</button>`);}
function showResults(endedEarly=false){if(practice)return practiceResults(endedEarly);const ranked=players.map((p,i)=>({...p,i})).sort((a,b)=>b.index-a.index||(a.finished??Infinity)-(b.finished??Infinity)||a.errors-b.errors);modal(`<div class="eyebrow">${endedEarly?'MATCH ENDED':'CHALLENGE COMPLETE'}</div><h2>${endedEarly?'比赛已结束':'每一份认真，都值得喝彩。'}</h2><p>${endedEarly?'以下是结束时各队的成绩。':'按完成题数、完成用时排名。错误答案可修改重试。'}</p>${ranked.map((p,r)=>`<div class="result-row"><strong>${endedEarly?'●':['🥇','🥈','🥉','✦'][r]} ${names[p.i]}</strong><span>${p.index}/${goal} 题 · ${p.finished===null?'未完成 · 比赛用时 '+format(elapsed):'完成用时 '+format(p.finished)} · 错误 ${p.errors} 次</span></div>`).join('')}<button class="btn primary" data-close>查看赛场</button> <button class="btn" id="again">再来一局</button>`);}
async function start(){if(['running','paused','countdown'].includes(phase)){modal('<h2>重新开始本轮？</h2><p>当前比赛进度将清空，并生成一组新题。</p><button class="btn primary" id="restart">重新开始</button> <button class="btn" data-close>继续当前比赛</button>');return;}begin();}
function begin(){prepare();phase='countdown';const id=roundId;$('#start').disabled=true;render();$('#modal').hidden=false;$('#dialog').style.cssText='background:transparent;box-shadow:none;text-align:center';let n=3;$('#dialog').innerHTML='<div class="countdown">'+n+'</div>';const step=()=>{if(id!==roundId)return;if(--n>0){$('#dialog').innerHTML='<div class="countdown">'+n+'</div>';setTimeout(step,700);}else{$('#dialog').style.cssText='';$('#modal').hidden=true;phase='running';startTime=performance.now();$('#state').textContent=tx('比赛进行中 · 加油！');$('#start').disabled=false;$('#start').textContent='重新开始';$('#pause').disabled=false;$('#stop').disabled=false;players.forEach(p=>p.feedback='从个位开始，填写你的答案');interval=setInterval(tick,250);render();}};setTimeout(step,700);}
$('#arena').addEventListener('click',e=>{const card=e.target.closest('[data-player]');if(!card)return;const i=+card.dataset.player;const cell=e.target.closest('[data-row]');if(cell&&phase==='running'){players[i].cursor=[+cell.dataset.row,+cell.dataset.col];selected=i;render();}else if(e.target.closest('[data-key]'))input(i,e.target.closest('[data-key]').dataset.key);else if(e.target.closest('[data-hint]'))hint(i);else if(e.target.closest('[data-submit]'))submit(i);});
$('#players').addEventListener('click',e=>{if(e.target.dataset.practice){practice=true;count=1;selected=0;prepare();}else if(e.target.dataset.count){practice=false;count=+e.target.dataset.count;selected=0;prepare();}});$('#type').onchange=$('#goal').onchange=prepare;$('#start').onclick=start;
$('#pause').onclick=()=>{if(phase==='running'){elapsed=elapsedNow();clearInterval(interval);phase='paused';$('#pause').textContent='继续';$('#state').textContent=tx('比赛已暂停');}else if(phase==='paused'){phase='running';startTime=performance.now();interval=setInterval(tick,250);$('#pause').textContent='暂停';$('#state').textContent=tx('比赛进行中 · 加油！');}render();};
$('#stop').onclick=()=>{if(!['running','paused'].includes(phase))return;modal('<h2>结束本场比赛？</h2><p>结束后会显示各队已完成的题数和用时。</p><button class="btn primary" id="confirm-stop">结束并查看成绩</button> <button class="btn" data-close>继续比赛</button>');};
function stopMatch(){if(!['running','paused'].includes(phase))return;elapsed=elapsedNow();clearInterval(interval);phase='finished';tick();$('#state').textContent=tx('本轮比赛已结束');$('#pause').disabled=true;$('#pause').textContent='暂停';$('#stop').disabled=true;$('#start').textContent='再来一局 ↗';showResults(true);render();}
$('#help').onclick=()=>modal('<div class="eyebrow">HOW TO PLAY</div><h2>一起，算出好成绩。</h2><p>① 选择 1～4 人、乘法题型和题数，点击开始比赛。所有选手使用同一组题目，各自随机排序，首题也互不相同。</p><p>② 使用各自的数字键盘，从个位向左填写。点击任意方格可以修改。较大的数放上方，较小的数放下方。末尾有 0 时，先去掉两个因数末尾的 0，计算竖式；算对后再补回相同个数的 0。其他两位数乘法填写两行分步积和最后结果，第二行已向左错开一位。</p><p>③ 点击确认答案，答对进入下一题，答错可继续修改。完成全部题目后记录用时，所有人完成后显示排名。</p><p>④ 电脑键盘数字可操作当前选手；Tab 切换选手，Enter 提交，Backspace 退格。多人触屏时，各自点击本队按键即可。</p><p>⑤ 想自己慢慢练，点「单人练习」：没有排名，写错的那一行会标红，卡住时点「提示」帮你填上当前格，结束后会看到一次做对的题数和正确率。</p><button class="btn primary" data-close>知道了</button>');
$('#modal').onclick=e=>{if(e.target.id==='confirm-stop'){stopMatch();return;}if(e.target.closest('[data-close]'))$('#modal').hidden=true;if(e.target.id==='again'||e.target.id==='restart'){$('#modal').hidden=true;begin();}};
$('#fullscreen').onclick=async()=>{try{if(document.fullscreenElement)await document.exitFullscreen();else await document.documentElement.requestFullscreen();}catch{$('#toast').textContent='当前窗口不支持全屏，请在浏览器中打开后按 F11';setTimeout(()=>$('#toast').textContent='',4500);}};
document.addEventListener('fullscreenchange',()=>$('#fullscreen').textContent=document.fullscreenElement?'⛶ 退出全屏':'⛶ 全屏');
document.addEventListener('keydown',e=>{if(phase!=='running'||!$('#modal').hidden||['SELECT','INPUT'].includes(e.target.tagName)||e.ctrlKey||e.metaKey||e.altKey)return;if(/^\d$/.test(e.key)){e.preventDefault();input(selected,e.key);}else if(e.key==='Backspace'){e.preventDefault();input(selected,'⌫');}else if(e.key==='Enter'){e.preventDefault();submit(selected);}else if(e.key==='Tab'){e.preventDefault();selected=(selected+(e.shiftKey?count-1:1))%count;render();}});
// Touch input is handled on pointer-down so simultaneous players never lose
// a key when another player's update refreshes the board before pointer-up.
$('#arena').addEventListener('pointerdown',e=>{if(e.pointerType!=='touch')return;const key=e.target.closest('[data-key]'),cell=e.target.closest('[data-row]'),submitKey=e.target.closest('[data-submit]'),card=e.target.closest('[data-player]');if(!card||phase!=='running')return;e.preventDefault();const i=+card.dataset.player;if(key)input(i,key.dataset.key);else if(submitKey)submit(i);else if(cell){players[i].cursor=[+cell.dataset.row,+cell.dataset.col];selected=i;render();}});
prepare();

</script></body></html>
